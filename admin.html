<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/variable/woff2/PretendardVariable.woff2">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="css/styles.css">
<title>관리자 — doion(도이온)</title>
</head>
<body>

<main>
  <section class="contact" style="padding-top: var(--sp-8); padding-bottom: var(--sp-8);">
    <div class="wrap" style="max-width: 460px;">
      <p class="eyebrow">// ADMIN</p>
      <h1 style="font-size: clamp(1.5rem, 4vw, 2rem); margin-bottom: var(--sp-2);">실시간 상담 상태 관리</h1>
      <p style="color: var(--text-muted); margin: 0 0 var(--sp-6);">우측 하단 위젯에 표시되는 상담 가능 여부를 수동으로 고정하거나, 자동(시간표 기준) 모드로 되돌릴 수 있습니다.</p>

      <div id="authGate">
        <label style="display: flex; flex-direction: column; gap: var(--sp-2); font-size: 0.92rem; font-weight: 600; color: var(--text-muted); margin-bottom: var(--sp-4);">
          <span>관리자 비밀번호</span>
          <input type="password" id="adminToken" placeholder="비밀번호 입력" style="width: 100%; font-family: var(--font-body); font-size: 1rem; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--text);">
        </label>
        <button type="button" class="btn btn-solid btn-full" id="loginBtn">확인</button>
        <p id="authNote" class="form-note"></p>
      </div>

      <div id="panel" style="display: none;">
        <div class="live-status" id="statusPreview" style="position: static; display: inline-flex; margin-bottom: var(--sp-6);">
          <span class="live-status-dot"></span>
          <span class="live-status-text" id="currentStatus">확인 중...</span>
        </div>

        <div style="display: flex; flex-direction: column; gap: var(--sp-3);">
          <button type="button" class="btn btn-solid" data-set="true">지금 상담 가능으로 고정</button>
          <button type="button" class="btn btn-ghost" data-set="false">지금 상담 불가로 고정 (문의는 웹사이트로)</button>
          <button type="button" class="btn btn-ghost" data-set="auto">자동 모드로 되돌리기 (시간표 기준)</button>
        </div>
        <p id="actionNote" class="form-note"></p>
      </div>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";

  var authGate = document.getElementById("authGate");
  var panel = document.getElementById("panel");
  var tokenInput = document.getElementById("adminToken");
  var loginBtn = document.getElementById("loginBtn");
  var authNote = document.getElementById("authNote");
  var statusPreview = document.getElementById("statusPreview");
  var currentStatus = document.getElementById("currentStatus");
  var actionNote = document.getElementById("actionNote");

  var token = sessionStorage.getItem("doion_admin_token") || "";

  function labelFor(override) {
    if (override === true) return "상담 가능 (수동 고정)";
    if (override === false) return "상담 불가 (수동 고정)";
    return "자동 (시간표 기준)";
  }

  function loadStatus() {
    fetch("/api/status", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        currentStatus.textContent = labelFor(data.override);
        statusPreview.classList.toggle("is-live", data.override === true);
        if (data.configured === false) {
          actionNote.textContent = "아직 KV 연동이 안 되어 있어 저장이 되지 않습니다. Vercel 프로젝트에 KV를 연동해주세요.";
          actionNote.classList.add("is-error");
        }
      })
      .catch(function () {
        currentStatus.textContent = "불러오기 실패";
      });
  }

  function showPanel() {
    authGate.style.display = "none";
    panel.style.display = "block";
    loadStatus();
  }

  if (token) showPanel();

  loginBtn.addEventListener("click", function () {
    token = tokenInput.value.trim();
    if (!token) return;
    sessionStorage.setItem("doion_admin_token", token);
    authNote.textContent = "";
    authNote.classList.remove("is-error");
    showPanel();
  });

  tokenInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") loginBtn.click();
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-set]"), function (btn) {
    btn.addEventListener("click", function () {
      var v = btn.getAttribute("data-set");
      var override = v === "true" ? true : v === "false" ? false : null;

      actionNote.textContent = "적용 중...";
      actionNote.classList.remove("is-error", "is-success");

      fetch("/api/status", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
        body: JSON.stringify({ override: override })
      })
        .then(function (r) {
          if (r.status === 401) {
            sessionStorage.removeItem("doion_admin_token");
            panel.style.display = "none";
            authGate.style.display = "block";
            authNote.textContent = "비밀번호가 올바르지 않습니다. 다시 입력해주세요.";
            authNote.classList.add("is-error");
            return null;
          }
          return r.json();
        })
        .then(function (data) {
          if (!data) return;
          if (data.ok) {
            actionNote.textContent = "적용되었습니다.";
            actionNote.classList.add("is-success");
            loadStatus();
          } else {
            actionNote.textContent = "적용 실패: " + (data.error || "알 수 없는 오류");
            actionNote.classList.add("is-error");
          }
        })
        .catch(function () {
          actionNote.textContent = "오류가 발생했습니다.";
          actionNote.classList.add("is-error");
        });
    });
  });
})();
</script>
</body>
</html>
