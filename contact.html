<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/variable/woff2/PretendardVariable.woff2">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="css/styles.css">
<title>무료 상담 신청 — doion(도이온)</title>
<meta name="description" content="도이온 웹사이트 제작 무료 상담 신청 — 매장 이름과 연락처만 남겨주세요.">
<link rel="canonical" href="https://doion.co.kr/contact.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="doion(도이온)">
<meta property="og:locale" content="ko_KR">
<meta property="og:url" content="https://doion.co.kr/contact.html">
<meta property="og:title" content="무료 상담 신청 — doion(도이온)">
<meta property="og:description" content="도이온 웹사이트 제작 무료 상담 신청 — 매장 이름과 연락처만 남겨주세요.">
<meta property="og:image" content="https://doion.co.kr/assets/logo-dark.png">
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <a href="index.html" class="logo"><img src="assets/logo-dark.png" alt="doion" width="64" height="26"></a>
    <nav class="nav-links" id="navLinks">
      <a href="index.html">홈</a>
      <a href="pricing.html">가격</a>
      <a href="portfolio.html">포트폴리오</a>
      <a href="process.html">진행방식</a>
    </nav>
    <div class="nav-actions">
      <a href="contact.html" class="btn btn-solid btn-sm" aria-current="page">무료 상담 신청</a>
      <button type="button" class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navLinks" aria-label="메뉴 열기">
        <span class="nav-toggle-bar"></span><span class="nav-toggle-bar"></span><span class="nav-toggle-bar"></span>
      </button>
    </div>
  </div>
</header>

<main>

  <section class="contact" style="padding-top: var(--sp-8);">
    <div class="wrap">
      <div class="contact-panel">
        <div class="contact-copy">
          <p class="eyebrow">// FREE CONSULTATION</p>
          <h1>무료 상담 신청</h1>
          <p>매장 이름과 연락처만 남겨주시면, 도이온이 직접 연락드립니다.</p>
        </div>

        <form class="contact-form" id="contactForm">
          <label>
            <span>매장 이름</span>
            <input type="text" name="shopName" placeholder="매장 이름을 입력해주세요" required>
          </label>
          <label>
            <span>담당자 이름</span>
            <input type="text" name="managerName" placeholder="예: 홍길동" required>
          </label>
          <label>
            <span>연락처</span>
            <input type="tel" name="phone" placeholder="010-0000-0000" required>
          </label>
          <button type="submit" class="btn btn-solid btn-full">상담 신청하기</button>
          <p class="form-note" id="formNote"></p>
        </form>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p class="logo"><img src="assets/logo-dark.png" alt="doion" width="64" height="26"></p>
    <p>소규모 매장을 위한 웹사이트 제작·관리 대행</p>
  </div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
